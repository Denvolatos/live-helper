<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>直播助手</title>
<script>
// 在样式加载前就定下主题，避免启动时闪一下
(function () {
  var t = null;
  try { t = localStorage.getItem("lh-theme"); } catch (e) {}
  if (t !== "dark" && t !== "light") {
    t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside class="side">
  <div class="brand"><span class="dot"></span>直播助手</div>
  <h3>我的收藏</h3>
  <div class="empty-side">暂无收藏</div>
</aside>
<main class="main">
  <header class="top">
    <form id="form" class="search" autocomplete="off">
      <input id="q" type="text" placeholder="搜索主播名，或粘贴房间号 / 房间链接" spellcheck="false">
      <button id="go" class="btn-accent" type="submit">搜索</button>
    </form>
    <div class="plats" id="plats">
      <label class="chip"><input type="checkbox" value="huya" checked><span>虎牙</span></label>
      <label class="chip"><input type="checkbox" value="douyu" checked><span>斗鱼</span></label>
      <label class="chip"><input type="checkbox" value="bili" checked><span>B站</span></label>
    </div>
    <button id="theme" class="ghost" type="button" title="切换深浅色" aria-label="切换深浅色">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div id="notes" class="notes"></div>
  <div id="status" class="status"></div>
  <section id="grid" class="grid"></section>
</main>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
